<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xpress Marketing</title>
<meta name="theme-color" content="#062540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xpress Marketing">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>/* apply the saved theme before first paint */
try{var t=JSON.parse(localStorage.getItem("xpm_theme"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body class="locked">

<div id="login" role="dialog" aria-label="Sign in"></div>

<div class="bar">
  <button class="ic" id="burger" type="button" aria-label="Open menu">☰</button>
  <span class="brand"><img class="mark" src="xpress-icon.png" alt="Xpress"><span>Marketing</span></span>
</div>

<aside class="sb" id="sb" aria-label="Main menu">
  <div class="sbh">
    <a class="brand" href="#home"><img class="logo l" src="xpress-logo.png" alt="Xpress"><img class="logo d" src="xpress-logo-dark.png" alt="Xpress"><span>Marketing</span></a>
    <button class="ic" id="col" type="button" aria-label="Collapse sidebar">«</button>
  </div>
  <nav id="nav"></nav>
  <div class="sbf" id="sbf"></div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="page"><div id="main"></div></div>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
